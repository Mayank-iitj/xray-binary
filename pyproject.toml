[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xray-binary"
version = "1.0.0"
description = "Static, explainable malware triage via Weisfeiler-Lehman kernels and call-graph GNN"
authors = [{ name = "Mayank Sharma" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "networkx>=3.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.98.0",
]

[project.scripts]
xray = "xray_core.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-dir]
"" = "packages"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "E402",  # Module level import not at top of file (sys.path initialization for local packages)
    "E741",  # Ambiguous variable name
    "E701",  # Multiple statements on one line (colon)
    "E702",  # Multiple statements on one line (semicolon)
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
explicit_package_bases = true
mypy_path = ["packages", "."]

